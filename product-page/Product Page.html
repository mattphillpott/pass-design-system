<!DOCTYPE html>
<!-- @dsCard group="Brand" name="Product Page Redesign" subtitle="Four tidied variations of the right column, linking to the booking wizard" viewport="1600x2000" -->
<html lang="en-GB">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Product Page Redesign — Functional Skills Maths Level 2</title>
<link rel="stylesheet" href="colors_and_type.css"/>
<style>
  body { margin: 0; background: #F9FAFB; }
  .frame {
    background: #fff; padding: 32px;
    border: 1px solid #E5E7EB; border-radius: 14px;
  }
  /* Suppress lucide black square fallback for nice rendering */
  span[aria-hidden="true"] svg { display: block; }
</style>
</head>
<body>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="pfs-icon.jsx"></script>
<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="product-shared.jsx"></script>
<script type="text/babel" src="product-variations.jsx"></script>

<div id="root"></div>

<script type="text/babel">
  const { VariationA, VariationB, VariationC, VariationD } = window.PRODUCT_VARIATIONS;

  function App() {
    return (
      <DesignCanvas title="Product page redesign — right column" subtitle="Functional Skills Maths Level 2 · drop-in replacement for the current product detail panel">
        <DCSection id="variations" title="Tidied product page" subtitle="Width-locked to the current right column (~640px). Single primary CTA links to the booking wizard.">
          <DCArtboard id="A" label="A — Magazine" width={720} height={1900}>
            <div className="frame"><VariationA/></div>
          </DCArtboard>
          <DCArtboard id="B" label="B — Sticky price card" width={720} height={1700}>
            <div className="frame"><VariationB/></div>
          </DCArtboard>
          <DCArtboard id="C" label="C — Outcomes-led" width={720} height={1900}>
            <div className="frame"><VariationC/></div>
          </DCArtboard>
          <DCArtboard id="D" label="D — Conversion max" width={720} height={1900}>
            <div className="frame"><VariationD/></div>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
