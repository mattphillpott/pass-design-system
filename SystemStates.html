<!DOCTYPE html>
<html lang="en-GB" class="pass-revise">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>System states — Pass Revise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<link rel="stylesheet" href="site.css">
<style>
  .states-head{padding:36px 0 8px;text-align:center}
  .states-head h1{font-size:30px;font-weight:800}
  .states-head p{color:var(--fg-4);margin-top:8px}
  .state-seg{display:flex;justify-content:center;margin:22px 0 6px}
  .state-seg .seg{display:inline-flex;background:var(--bg-raised);border:1px solid var(--border-default);border-radius:var(--radius-full);padding:4px;gap:4px;flex-wrap:wrap;justify-content:center}
  .state-seg .seg button{height:38px;padding:0 18px;border:none;background:transparent;color:var(--fg-2);font-weight:600;font-size:14px;border-radius:var(--radius-full);cursor:pointer}
  .state-seg .seg button.on{background:var(--bg-surface);color:var(--fg-1);box-shadow:var(--shadow-sm)}
  .state-note{text-align:center;color:var(--fg-4);font-size:14px;max-width:60ch;margin:10px auto 0}
  .stage{max-width:900px;margin:26px auto 40px;padding:0 24px}
  .frame{border:1px solid var(--border-default);border-radius:var(--radius-2xl);background:var(--bg-surface);overflow:hidden;min-height:440px;display:flex;flex-direction:column}
  .frame-bar{display:flex;align-items:center;gap:7px;padding:12px 16px;border-bottom:1px solid var(--border-default);background:var(--bg-page-alt)}
  .frame-bar i{width:11px;height:11px;border-radius:50%;background:var(--border-strong);display:block}
  .frame-bar .url{margin-left:12px;font-size:12.5px;color:var(--fg-4);background:var(--bg-surface);border:1px solid var(--border-default);border-radius:var(--radius-full);padding:4px 12px}
  .frame-body{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 32px}

  /* centered state */
  .cs{text-align:center;max-width:460px}
  .cs .ic{width:80px;height:80px;border-radius:50%;display:grid;place-items:center;margin:0 auto 20px}
  .cs .ic svg{width:38px;height:38px}
  .ic-muted{background:var(--bg-raised);color:var(--fg-4)}
  .ic-amber{background:var(--accent-bg);color:var(--accent-fg)}
  .ic-danger{background:var(--color-danger-bg,#FEF2F2);color:var(--color-danger,#DC2626)}
  .cs .big{font-size:64px;font-weight:800;letter-spacing:-.04em;color:var(--primary);line-height:1;margin-bottom:8px}
  .cs h2{font-size:24px;font-weight:800}
  .cs p{margin:12px auto 0;color:var(--fg-3);font-size:15.5px}
  .cs .btnrow{display:flex;gap:11px;justify-content:center;margin-top:24px;flex-wrap:wrap}
  .cs .mini-search{display:flex;align-items:center;gap:10px;max-width:340px;margin:20px auto 0;height:48px;padding:0 14px;border:1px solid var(--border-strong);border-radius:var(--radius-lg);background:var(--bg-page)}
  .cs .mini-search svg{width:18px;height:18px;color:var(--fg-4)}
  .cs .mini-search input{flex:1;border:none;background:transparent;color:var(--fg-1);font-size:15px;outline:none;font-family:inherit}

  /* loading skeleton */
  .sk{width:100%;align-self:stretch;padding:6px}
  .sk-row{display:flex;gap:20px}
  .sk-side{width:220px;flex:none}
  .sk-main{flex:1}
  .skl{background:var(--bg-raised);border-radius:8px;position:relative;overflow:hidden}
  .skl::after{content:"";position:absolute;inset:0;transform:translateX(-100%);background:linear-gradient(90deg,transparent,color-mix(in srgb,var(--fg-5) 22%,transparent),transparent);animation:shim 1.3s infinite}
  @keyframes shim{100%{transform:translateX(100%)}}
  .sk-title{height:30px;width:60%;margin-bottom:10px}
  .sk-sub{height:14px;width:40%;margin-bottom:26px}
  .sk-line{height:13px;margin:11px 0}
  .sk-card{height:120px;border-radius:var(--radius-lg);margin-bottom:14px}
  .sk-navitem{height:38px;border-radius:var(--radius-md);margin-bottom:9px}
  [data-reduce-motion] .skl::after{animation:none}

  @media (max-width:640px){ .sk-side{display:none} .frame-body{padding:26px 18px} }
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<script>window.SITE = { active:'', authed:false };</script>

<main id="main">
  <section class="states-head">
    <div class="wrap">
      <span class="eyebrow">System</span>
      <h1 style="margin-top:12px">System states</h1>
      <p>The shared loading, empty, error and gone states used across every screen.</p>
    </div>
  </section>

  <div class="state-seg">
    <div class="seg" id="seg">
      <button class="on" data-s="loading">Loading</button>
      <button data-s="empty">Empty</button>
      <button data-s="error">Error</button>
      <button data-s="404">404</button>
      <button data-s="410">410 Gone</button>
    </div>
  </div>
  <p class="state-note" id="note"></p>

  <div class="stage">
    <div class="frame">
      <div class="frame-bar"><i></i><i></i><i></i><span class="url" id="frameUrl">passrevise.co.uk</span></div>
      <div class="frame-body" id="frameBody"></div>
    </div>
  </div>
</main>

<script src="site.js"></script>
<script>
(function(){
  var NOTES = {
    loading:'Shown while content is being fetched — including the structural paywall’s in-place load. Skeletons mirror the final layout so nothing jumps.',
    empty:'Shown when a valid screen simply has no items yet — a first-time saved list, an unattempted topic. Always offers a clear next step.',
    error:'Shown when something fails unexpectedly. Non-alarming, with a retry and a way out. Never blames the student.',
    404:'The page doesn’t exist. Offers search and safe routes back — never a dead end.',
    410:'The content existed but has been permanently removed (e.g. a withdrawn past paper). Explains why and points to alternatives.'
  };
  var URLS = { loading:'passrevise.co.uk/…/electrolysis', empty:'passrevise.co.uk/account/saved', error:'passrevise.co.uk/…/electrolysis', '404':'passrevise.co.uk/oops', '410':'passrevise.co.uk/papers/withdrawn' };
  var mag='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>';

  function loadingHTML(){
    return '<div class="sk"><div class="skl sk-title"></div><div class="skl sk-sub"></div>'
      + '<div class="sk-row"><div class="sk-side">'
      + '<div class="skl sk-navitem"></div><div class="skl sk-navitem"></div><div class="skl sk-navitem"></div><div class="skl sk-navitem"></div><div class="skl sk-navitem"></div>'
      + '</div><div class="sk-main">'
      + '<div class="skl sk-card"></div>'
      + '<div class="skl sk-line" style="width:96%"></div><div class="skl sk-line" style="width:88%"></div><div class="skl sk-line" style="width:92%"></div><div class="skl sk-line" style="width:70%"></div>'
      + '<div class="skl sk-card" style="margin-top:20px"></div>'
      + '</div></div></div>';
  }
  function emptyHTML(){
    return '<div class="cs"><div class="ic ic-muted"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg></div>'
      + '<h2>Nothing saved yet</h2><p>Bookmark notes, questions and past papers as you revise and they’ll show up here for quick access.</p>'
      + '<div class="btnrow"><a class="btn btn-primary" href="hub/Course Hub.html">Browse subjects</a><a class="btn btn-outline" href="Search.html">Search</a></div></div>';
  }
  function errorHTML(){
    return '<div class="cs"><div class="ic ic-amber"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9 1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/></svg></div>'
      + '<h2>Something went wrong</h2><p>We couldn’t load this just now. It’s not you — please try again in a moment.</p>'
      + '<div class="btnrow"><button class="btn btn-primary" onclick="this.textContent=\'Retrying…\'">Try again</button><a class="btn btn-outline" href="Homepage.html">Go home</a></div></div>';
  }
  function nf404HTML(){
    return '<div class="cs"><div class="big">404</div><h2>Page not found</h2><p>The page you’re looking for doesn’t exist or has moved. Try searching, or head back to safe ground.</p>'
      + '<div class="mini-search">'+mag+'<input placeholder="Search Pass Revise…" aria-label="Search"></div>'
      + '<div class="btnrow"><a class="btn btn-primary" href="Homepage.html">Back to home</a><a class="btn btn-outline" href="hub/Course Hub.html">Browse subjects</a></div></div>';
  }
  function gone410HTML(){
    return '<div class="cs"><div class="ic ic-danger"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 12h8"/></svg></div>'
      + '<h2>This content is no longer available</h2><p>This past paper has been withdrawn by the exam board and permanently removed. The rest of the course is unaffected.</p>'
      + '<div class="btnrow"><a class="btn btn-primary" href="exam-question/Exam Question.html">See current papers</a><a class="btn btn-outline" href="hub/Course Hub.html">Browse subjects</a></div></div>';
  }
  var R = { loading:loadingHTML, empty:emptyHTML, error:errorHTML, '404':nf404HTML, '410':gone410HTML };
  var body=document.getElementById('frameBody'), note=document.getElementById('note'), url=document.getElementById('frameUrl');
  function show(s){ body.innerHTML=R[s](); note.textContent=NOTES[s]; url.textContent=URLS[s]; }
  document.getElementById('seg').addEventListener('click', function(e){ var b=e.target.closest('[data-s]'); if(!b) return; [].forEach.call(this.children,function(c){c.classList.toggle('on',c===b);}); show(b.getAttribute('data-s')); });
  show('loading');
})();
</script>
</body>
</html>
