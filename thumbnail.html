<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pass Design System</title>
<link rel="stylesheet" href="styles.css">
<style>
  html, body { margin: 0; padding: 0; }
  .tile {
    width: 1280px; height: 854px;
    display: flex;
    font-family: var(--font-sans, 'Inter', sans-serif);
    overflow: hidden;
  }
  .main {
    flex: 0 0 75%;
    background: var(--color-primary, #0FBC0F);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 64px;
  }
  .main .name {
    color: #fff;
    font-weight: 800;
    font-size: 232px;
    line-height: 0.9;
    letter-spacing: -0.04em;
    white-space: nowrap;
  }
  .strip { flex: 1 1 25%; display: flex; flex-direction: column; }
  .strip > div { flex: 1; }
</style>
</head>
<body>
  <div class="tile">
    <div class="main"><div class="name">Pass</div></div>
    <div class="strip">
      <div style="background:#F97316;"></div>
      <div style="background:#D97706;"></div>
      <div style="background:#1C64F2;"></div>
      <div style="background:#C70036;"></div>
    </div>
  </div>
</body>
</html>
