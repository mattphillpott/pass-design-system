<!DOCTYPE html>
<!-- @dsCard group="Spacing" name="Shadows" subtitle="sm → xl" viewport="720x170" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css?v=1777049570539"><style>
body{margin:0;padding:28px;background:#F9FAFB;font-family:var(--font-sans)}
.row{display:grid;grid-template-columns:repeat(5,1fr);gap:20px}
.box{background:#fff;border-radius:12px;height:100px;display:flex;align-items:flex-end;padding:10px;font-size:11px;color:#6A7282;font-family:ui-monospace,monospace}
</style></head><body>
<div class="row">
<div class="box" style="box-shadow:0 1px 2px 0 rgba(0,0,0,0.05)">shadow-sm</div>
<div class="box" style="box-shadow:0 1px 3px 0 rgba(0,0,0,.1),0 1px 2px -1px rgba(0,0,0,.1)">shadow</div>
<div class="box" style="box-shadow:0 4px 6px -1px rgba(0,0,0,.1),0 2px 4px -2px rgba(0,0,0,.1)">shadow-md</div>
<div class="box" style="box-shadow:0 10px 15px -3px rgba(0,0,0,.1),0 4px 6px -4px rgba(0,0,0,.1)">shadow-lg</div>
<div class="box" style="box-shadow:0 20px 25px -5px rgba(0,0,0,.1),0 8px 10px -6px rgba(0,0,0,.1)">shadow-xl</div>
</div>
</body></html>
