<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="design_doc_mode" content="canvas">
<title>My Courses — forced-IA banner + rethink (3 directions)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="pass.css">
<link rel="stylesheet" href="ia.css">
<link rel="stylesheet" href="as.css">
<link rel="stylesheet" href="mc.css">
<style>
  body{margin:0;background:#ECEEF1;font-family:'Inter',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
  a,a:hover{color:var(--green-dark);}
  .doc-title{font:800 32px 'Inter',sans-serif;color:#101828;letter-spacing:-.01em;}
  .doc-sub{font:500 15.5px 'Inter',sans-serif;color:#5b6472;margin-top:8px;max-width:1000px;line-height:1.55;}
  .doc-sub b{color:#1b2330;font-weight:700;}
  .flabel{font:600 13px 'Inter',sans-serif;color:#5b6472;margin-bottom:10px;}
  .flabel b{color:#0BA00B;font-weight:800;}
  .flabel .sub{display:block;color:#8b95a3;font-weight:500;margin-top:3px;}
  .reccard{background:#fff;border:1px solid #e4e7ec;border-radius:16px;box-shadow:0 1px 0 rgba(16,24,40,.04);padding:22px 24px;}
  .reccard h4{font:800 15px 'Inter',sans-serif;color:#101828;margin:0 0 12px;display:flex;align-items:center;gap:9px;}
  .reccard h4 svg{width:17px;height:17px;color:#0FBC0F;}
  .reccard ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:11px;}
  .reccard li{font:500 14px 'Inter',sans-serif;color:#4A5565;line-height:1.5;display:flex;gap:10px;align-items:flex-start;}
  .reccard li .k{flex:0 0 auto;width:22px;height:22px;border-radius:6px;background:#EAFFE9;color:#0BA00B;font:800 11px 'Inter',sans-serif;display:flex;align-items:center;justify-content:center;margin-top:1px;}
  .reccard li b{color:#101828;font-weight:700;}
</style>
</head>
<body>
<template id="__bundler_thumbnail" data-bg-color="#0FBC0F">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#0FBC0F"/>
    <g transform="translate(360,250)" fill="none" stroke="#fff" stroke-width="22" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="480" height="70" rx="16" fill="rgba(255,255,255,.18)" stroke="none"/>
      <rect x="0" y="110" width="480" height="70" rx="16" fill="rgba(255,255,255,.12)" stroke="none"/>
      <rect x="0" y="220" width="480" height="70" rx="16" fill="rgba(255,255,255,.12)" stroke="none"/>
    </g>
  </svg>
</template>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="pass-icons.js"></script>
<script src="ia-icons.js"></script>
<script type="text/babel" src="pass-components.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="mc-page.jsx"></script>
<script type="text/babel">
const { useTweaks, TweaksPanel, TweakSection, TweakRadio, TweakToggle } = window;
const { Ico, MyCoursesPage } = window;

const DEFAULTS = { forced: 'Few (3)', view: 'Table', enrolLock: true, enrolledOnly: false };
const FC = { 'None (0)': 0, 'One (1)': 1, 'Few (3)': 3, 'Many (6)': 6 };

function TitleBand() {
  return (
    <div data-drags-parent="1" style={{ position: 'absolute', left: 0, top: 24, width: 1180 }}>
      <div className="doc-title">My Courses — rethink + persistent forced-IA banner</div>
      <div className="doc-sub">The My Courses page rebuilt in the Pass Design System: enrolled courses split from the full catalogue, cleaner rows, working search + filters, and course enrolment <b>locked until required initial assessments are done</b>. Three ways to shape the forced-IA banner — designed to sit on every page and <b>scale from one to many</b> forced assessments. Change the forced count and options in <b>Tweaks</b>.</div>
    </div>
  );
}

function Head({ x, w, badge, title, sub }) {
  return (
    <div data-drags-parent="1" style={{ position: 'absolute', left: x, top: 200, width: w }}>
      <div className="flabel"><b>{badge}</b> · {title}<span className="sub">{sub}</span></div>
    </div>
  );
}

function Canvas() {
  const [t, setTweak] = useTweaks(DEFAULTS);
  const view = (t.view || 'Table').toLowerCase();
  const cfg = {
    forcedCount: FC[t.forced] ?? 3,
    view, setView: (v) => setTweak('view', v === 'cards' ? 'Cards' : 'Table'),
    enrolLock: !!t.enrolLock,
    enrolledOnly: !!t.enrolledOnly,
  };
  const key = cfg.forcedCount + '-' + cfg.enrolLock + '-' + cfg.enrolledOnly;

  const cols = [
    { v: 'A', x: 0, w: 1240, badge: 'Direction A', title: 'Compact bar', sub: 'One line + a single CTA. Calmest; scales to any count.' },
    { v: 'B', x: 1300, w: 1240, badge: 'Direction B', title: 'Scrollable chips', sub: 'A chip per forced IA in a horizontal scroller.' },
    { v: 'C', x: 2600, w: 1240, badge: 'Direction C', title: 'Collapsible list', sub: 'One-line summary that expands to the full list.' },
  ];

  return (
    <>
      <TitleBand />
      {cols.map(c => (
        <React.Fragment key={c.v}>
          <Head x={c.x} w={c.w} badge={c.badge} title={c.title} sub={c.sub} />
          <div data-drags-parent="1" style={{ position: 'absolute', left: c.x, top: 262, width: c.w }}>
            <div style={{ background: '#fff', borderRadius: 16, boxShadow: '0 1px 0 rgba(16,24,40,.04), 0 18px 50px -18px rgba(16,24,40,.22)', overflow: 'hidden', border: '1px solid #e4e7ec' }}>
              <MyCoursesPage key={c.v + '-' + key} direction={c.v} cfg={cfg} />
            </div>
          </div>
        </React.Fragment>
      ))}

      <div data-drags-parent="1" style={{ position: 'absolute', left: 0, top: 1560, width: 1240 }}>
        <div className="reccard">
          <h4><Ico name="Star" size={17} />On the banner</h4>
          <ul>
            <li><span className="k">A</span><div><b>Compact bar</b> — recommended as the persistent site-wide banner. One line, one CTA, identical whether there’s 1 or 20 forced IAs; the list lives on the Initial Assessments page.</div></li>
            <li><span className="k">B</span><div><b>Chips</b> — good on the IA-focused pages where acting on a specific assessment inline is useful; horizontal scroll keeps it to one row.</div></li>
            <li><span className="k">C</span><div><b>Collapsible</b> — best of both: compact by default, expands to the full list in place. Auto-expands for ≤3.</div></li>
            <li><span className="k">↓</span><div>Set <b>Forced count</b> to <b>Many (6)</b> to see each style hold up. At <b>0</b> the banner becomes a subtle all-clear.</div></li>
          </ul>
        </div>
      </div>

      <TweaksPanel>
        <TweakSection label="Forced initial assessments" />
        <TweakRadio label="How many" value={t.forced} options={['None (0)', 'One (1)', 'Few (3)', 'Many (6)']} onChange={(v) => setTweak('forced', v)} />
        <TweakToggle label="Lock enrolment until done" value={t.enrolLock} onChange={(v) => setTweak('enrolLock', v)} />
        <TweakSection label="All courses" />
        <TweakRadio label="View" value={t.view} options={['Table', 'Cards']} onChange={(v) => setTweak('view', v)} />
        <TweakToggle label="Enrolled only (default)" value={t.enrolledOnly} onChange={(v) => setTweak('enrolledOnly', v)} />
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Canvas />);
</script>
</body>
</html>
