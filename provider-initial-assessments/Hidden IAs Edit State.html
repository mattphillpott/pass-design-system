<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="design_doc_mode" content="canvas">
<title>Hide Initial Assessments — edit state (3 patterns)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="pass.css">
<link rel="stylesheet" href="ia.css">
<link rel="stylesheet" href="as.css">
<link rel="stylesheet" href="vs.css">
<style>
  body{margin:0;background:#ECEEF1;font-family:'Inter',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
  a,a:hover{color:var(--green-dark);}
  .doc-title{font:800 32px 'Inter',sans-serif;color:#101828;letter-spacing:-.01em;}
  .doc-sub{font:500 15.5px 'Inter',sans-serif;color:#5b6472;margin-top:8px;max-width:1000px;line-height:1.55;}
  .doc-sub b{color:#1b2330;font-weight:700;}
  .flabel{font:600 13px 'Inter',sans-serif;color:#5b6472;margin-bottom:10px;}
  .flabel b{color:#0BA00B;font-weight:800;}
  .flabel .sub{display:block;color:#8b95a3;font-weight:500;margin-top:3px;}
  .reccard{background:#fff;border:1px solid #e4e7ec;border-radius:16px;box-shadow:0 1px 0 rgba(16,24,40,.04);padding:22px 24px;}
  .reccard h4{font:800 15px 'Inter',sans-serif;color:#101828;margin:0 0 12px;display:flex;align-items:center;gap:9px;}
  .reccard h4 svg{width:17px;height:17px;color:#0FBC0F;}
  .reccard ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:11px;}
  .reccard li{font:500 14px 'Inter',sans-serif;color:#4A5565;line-height:1.5;display:flex;gap:10px;align-items:flex-start;}
  .reccard li .k{flex:0 0 auto;width:22px;height:22px;border-radius:6px;background:#EAFFE9;color:#0BA00B;font:800 11px 'Inter',sans-serif;display:flex;align-items:center;justify-content:center;margin-top:1px;}
  .reccard li b{color:#101828;font-weight:700;}
</style>
</head>
<body>
<template id="__bundler_thumbnail" data-bg-color="#0FBC0F">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#0FBC0F"/>
    <g transform="translate(420,250)" fill="none" stroke="#fff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
      <path d="M40 250 250 40l70 70L110 320H40Z" fill="rgba(255,255,255,.18)" stroke="none"/>
      <path d="M40 250 250 40l70 70L110 320H40Z"/>
      <path d="M210 80l70 70"/>
    </g>
  </svg>
</template>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="pass-icons.js"></script>
<script src="ia-icons.js"></script>
<script type="text/babel" src="pass-components.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="ia-parts.jsx"></script>
<script type="text/babel" src="vs-parts.jsx"></script>
<script type="text/babel" src="vsedit-parts.jsx"></script>
<script type="text/babel">
const { useTweaks, TweaksPanel, TweakSection, TweakRadio, TweakToggle } = window;
const { Ico, VSEditDirection } = window;

const DEFAULTS = { scenario: 'Mixed', showGlobal: true, preview: true };
const SCEN = { 'Mixed': 'mixed', 'Organisation only': 'global', 'Student overrides': 'student', 'None (empty)': 'none' };

function TitleBand() {
  return (
    <div data-drags-parent="1" style={{ position: 'absolute', left: 0, top: 24, width: 1160 }}>
      <div className="doc-title">Hide Initial Assessments — the edit state</div>
      <div className="doc-sub">The editable counterpart to the student view — reached from <b>Edit for this student</b>. Same three controls as the Add Student page (Rows / Toggle / Matrix), now <b>inheritance-aware</b>: every item starts from your organisation default, a change becomes a <b>student override</b>, and <b>Reset</b> sends it back. Compare the three, then pick. Scenario + options in <b>Tweaks</b>.</div>
    </div>
  );
}

function Head({ x, w, badge, title, sub }) {
  return (
    <div data-drags-parent="1" style={{ position: 'absolute', left: x, top: 150, width: w }}>
      <div className="flabel"><b>{badge}</b> · {title}<span className="sub">{sub}</span></div>
    </div>
  );
}

function Canvas() {
  const [t, setTweak] = useTweaks(DEFAULTS);
  const cfg = { scenario: SCEN[t.scenario] || 'mixed', showGlobal: !!t.showGlobal, preview: !!t.preview };
  const key = cfg.scenario + '-' + cfg.preview;

  const cols = [
    { v: 'A', x: 0, w: 1160, badge: 'Pattern A', title: 'Rows', sub: 'Inherited hides shown as chips; add extra hides for this student.' },
    { v: 'B', x: 1240, w: 1160, badge: 'Pattern B', title: 'Toggle list', sub: 'Switch each item; override/reset against the org default inline.' },
    { v: 'C', x: 2480, w: 1240, badge: 'Pattern C', title: 'Matrix', sub: 'Grid of subject × level; overridden cells marked, with reset.' },
  ];

  return (
    <>
      <TitleBand />
      {cols.map(c => (
        <React.Fragment key={c.v}>
          <Head x={c.x} w={c.w} badge={c.badge} title={c.title} sub={c.sub} />
          <div data-drags-parent="1" style={{ position: 'absolute', left: c.x, top: 214, width: c.w }}>
            <div style={{ background: '#fff', borderRadius: 16, boxShadow: '0 1px 0 rgba(16,24,40,.04), 0 18px 50px -18px rgba(16,24,40,.22)', overflow: 'hidden', border: '1px solid #e4e7ec' }}>
              <VSEditDirection key={c.v + '-' + key} variant={c.v} cfg={cfg} />
            </div>
          </div>
        </React.Fragment>
      ))}

      <div data-drags-parent="1" style={{ position: 'absolute', left: 0, top: 1620, width: 1160 }}>
        <div className="reccard">
          <h4><Ico name="Star" size={17} />How the override model behaves</h4>
          <ul>
            <li><span className="k">↺</span><div><b>Inherit by default.</b> Every item follows the organisation default until you change it for this student — then it shows a <b>Student override</b> and a <b>Reset</b> to return it to the org setting.</div></li>
            <li><span className="k">A</span><div><b>Rows</b> — org hides appear as chips you can “Show for {`Lewis`}”; add extra student-only hides with the same Subject + Level rows as Add Student.</div></li>
            <li><span className="k">B</span><div><b>Toggle</b> — the fastest to read state and override; recommended default, matching the Add Student toggle list.</div></li>
            <li><span className="k">C</span><div><b>Matrix</b> — best when subjects × levels grow; overridden cells are outlined with an inline reset.</div></li>
          </ul>
        </div>
      </div>

      <TweaksPanel>
        <TweakSection label="Starting point" />
        <TweakRadio label="Scenario" value={t.scenario} options={['Mixed', 'Organisation only', 'Student overrides', 'None (empty)']} onChange={(v) => setTweak('scenario', v)} />
        <TweakSection label="Detail" />
        <TweakToggle label="Show org value on overrides" value={t.showGlobal} onChange={(v) => setTweak('showGlobal', v)} />
        <TweakToggle label="Student-portal preview" value={t.preview} onChange={(v) => setTweak('preview', v)} />
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Canvas />);
</script>
</body>
</html>
