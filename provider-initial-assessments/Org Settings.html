<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="design_doc_mode" content="canvas">
<title>Org Settings — Initial Assessment Visibility (3 directions)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="pass.css">
<link rel="stylesheet" href="ia.css">
<link rel="stylesheet" href="as.css">
<link rel="stylesheet" href="os.css">
<style>
  body{margin:0;background:#ECEEF1;font-family:'Inter',sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
  a,a:hover{color:var(--green-dark);}
  .doc-title{font:800 32px 'Inter',sans-serif;color:#101828;letter-spacing:-.01em;}
  .doc-sub{font:500 15.5px 'Inter',sans-serif;color:#5b6472;margin-top:8px;max-width:1000px;line-height:1.55;}
  .doc-sub b{color:#1b2330;font-weight:700;}
  .flabel{font:600 13px 'Inter',sans-serif;color:#5b6472;margin-bottom:10px;}
  .flabel b{color:#0BA00B;font-weight:800;}
  .flabel .sub{display:block;color:#8b95a3;font-weight:500;margin-top:3px;}
  .reccard{background:#fff;border:1px solid #e4e7ec;border-radius:16px;box-shadow:0 1px 0 rgba(16,24,40,.04);padding:22px 24px;}
  .reccard h4{font:800 15px 'Inter',sans-serif;color:#101828;margin:0 0 12px;display:flex;align-items:center;gap:9px;}
  .reccard h4 svg{width:17px;height:17px;color:#0FBC0F;}
  .reccard ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:11px;}
  .reccard li{font:500 14px 'Inter',sans-serif;color:#4A5565;line-height:1.5;display:flex;gap:10px;align-items:flex-start;}
  .reccard li .k{flex:0 0 auto;width:22px;height:22px;border-radius:6px;background:#EAFFE9;color:#0BA00B;font:800 11px 'Inter',sans-serif;display:flex;align-items:center;justify-content:center;margin-top:1px;}
  .reccard li b{color:#101828;font-weight:700;}
</style>
</head>
<body>
<template id="__bundler_thumbnail" data-bg-color="#0FBC0F">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#0FBC0F"/>
    <g transform="translate(470,250)" fill="none" stroke="#fff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="130" cy="130" r="70"/>
      <path d="M130 20v-14M130 254v-14M20 130H6M254 130h-14M52 52l-10-10M208 208l10 10M208 52l10-10M52 208l-10 10"/>
    </g>
  </svg>
</template>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="pass-icons.js"></script>
<script src="ia-icons.js"></script>
<script type="text/babel" src="pass-components.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="ia-parts.jsx"></script>
<script type="text/babel" src="os-page.jsx"></script>
<script type="text/babel">
const { useTweaks, TweaksPanel, TweakSection, TweakRadio } = window;
const { Ico, OrgSettingsPage } = window;

const DEFAULTS = { warnStyle: 'Modal', state: 'Unconfirmed' };
const WARN = { 'Modal': 'modal', 'Type to confirm': 'type', 'Inline': 'inline' };

function TitleBand() {
  return (
    <div data-drags-parent="1" style={{ position: 'absolute', left: 0, top: 24, width: 1180 }}>
      <div className="doc-title">Org Settings — Initial Assessment Visibility</div>
      <div className="doc-sub">The Settings page rebuilt in the Pass Design System, with the new <b>Initial Assessment Visibility</b> card — the organisation-wide default that the Add Student control inherits. It adds one destructive power: <b>reset every student’s custom settings</b> to this default. Three ways to surface that action, compared side by side. Switch the confirmation style and state in <b>Tweaks</b>.</div>
    </div>
  );
}

function Head({ x, w, badge, title, sub }) {
  return (
    <div data-drags-parent="1" style={{ position: 'absolute', left: x, top: 200, width: w }}>
      <div className="flabel"><b>{badge}</b> · {title}<span className="sub">{sub}</span></div>
    </div>
  );
}

function Canvas() {
  const [t, setTweak] = useTweaks(DEFAULTS);
  const cfg = { warnStyle: WARN[t.warnStyle] || 'modal', state: (t.state || 'Unconfirmed').toLowerCase() };
  const key = cfg.warnStyle + '-' + cfg.state;

  const cols = [
    { v: 'A', x: 0, w: 1000, badge: 'Direction A', title: 'Checkbox beside Save', sub: '“Also apply to all existing students” opt-in next to the Save button.' },
    { v: 'B', x: 1060, w: 1000, badge: 'Direction B', title: 'Separate danger zone', sub: 'Save is safe; a distinct red zone resets existing students.' },
    { v: 'C', x: 2120, w: 1000, badge: 'Direction C', title: 'Save-time choice', sub: 'Saving asks: new students only, or all students?' },
  ];

  return (
    <>
      <TitleBand />
      {cols.map(c => (
        <React.Fragment key={c.v}>
          <Head x={c.x} w={c.w} badge={c.badge} title={c.title} sub={c.sub} />
          <div data-drags-parent="1" style={{ position: 'absolute', left: c.x, top: 262, width: c.w }}>
            <div style={{ background: '#fff', borderRadius: 16, boxShadow: '0 1px 0 rgba(16,24,40,.04), 0 18px 50px -18px rgba(16,24,40,.22)', overflow: 'hidden', border: '1px solid #e4e7ec' }}>
              <OrgSettingsPage key={c.v + '-' + key} direction={c.v} cfg={cfg} />
            </div>
          </div>
        </React.Fragment>
      ))}

      <div data-drags-parent="1" style={{ position: 'absolute', left: 0, top: 1700, width: 1000 }}>
        <div className="reccard">
          <h4><Ico name="Star" size={17} />On the destructive action</h4>
          <ul>
            <li><span className="k">A</span><div><b>Checkbox beside Save</b> — lowest friction, but bundles a destructive act into a normal Save. Keep the confirm modal so it’s never silent.</div></li>
            <li><span className="k">B</span><div><b>Separate danger zone</b> — recommended. Saving the default and resetting existing students are clearly different actions; the reset lives in a red zone with its own confirm. Safest mental model.</div></li>
            <li><span className="k">C</span><div><b>Save-time choice</b> — forces the decision every save; clear, but adds a step even when you only tweak the default.</div></li>
            <li><span className="k">!</span><div>All three show the <b>impact count</b> ({'23'} students) and warn it can’t be undone. <b>Type-to-confirm</b> (Tweaks) suits the truly irreversible bar.</div></li>
          </ul>
        </div>
      </div>

      <TweaksPanel>
        <TweakSection label="Destructive action" />
        <TweakRadio label="Confirmation" value={t.warnStyle} options={['Modal', 'Type to confirm', 'Inline']} onChange={(v) => setTweak('warnStyle', v)} />
        <TweakSection label="State" />
        <TweakRadio label="Show" value={t.state} options={['Unconfirmed', 'Confirmed']} onChange={(v) => setTweak('state', v)} />
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<Canvas />);
</script>
</body>
</html>
