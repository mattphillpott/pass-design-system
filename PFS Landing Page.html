<!DOCTYPE html>
<!-- @dsCard group="Brand" name="PFS Landing Page" subtitle="Conversion-optimised redesign in Pass Design System" -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pass Functional Skills — UK's #1 Functional Skills service</title>
<link rel="stylesheet" href="colors_and_type.css">
<style>
  html, body { margin: 0; background: #fff; }
  body { padding-bottom: 84px; }
  a { color: inherit; text-decoration: none; }
  .pass-btn { text-decoration: none !important; }
  select.pass-input { background-color: #fff; }
  /* Make select chevron visible behind native */
  .pass-input { font-family: 'Inter', sans-serif; }

  /* Responsive breakpoints */
  @media (max-width: 1024px) {
    .pfs-hero-grid, .pfs-final-grid, .pfs-why-grid, .pfs-footer-grid { flex-direction: column !important; display: flex !important; grid-template-columns: 1fr !important; }
    .pfs-routes-grid, .pfs-careers-grid, .pfs-reviews-grid, .pfs-process-grid { grid-template-columns: repeat(2, 1fr) !important; }
    .pfs-nav-links { display: none !important; }
    .pfs-nav-tagline { display: none !important; }
  }
  @media (max-width: 720px) {
    .pfs-routes-grid, .pfs-careers-grid, .pfs-reviews-grid, .pfs-process-grid { grid-template-columns: 1fr !important; }
    .pfs-top-strip { flex-direction: column !important; gap: 4px !important; padding: 8px 16px !important; text-align: center; }
  }
</style>
</head>
<body>
<div id="app"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="PFS Icon.jsx"></script>
<script type="text/babel" src="PFS Sections.jsx"></script>

<script type="text/babel">
function App() {
  return (
    <>
      <PFSTopStrip/>
      <PFSNav/>
      <main>
        <PFSHero/>
        <PFSLogos/>
        <PFSRoutes/>
        <PFSProcess/>
        <PFSCareers/>
        <PFSReviews/>
        <PFSWhy/>
        <PFSFinalCTA/>
      </main>
      <PFSFooter/>
      <PFSStickyBar/>
    </>
  );
}
ReactDOM.createRoot(document.getElementById('app')).render(<App/>);
</script>
</body>
</html>
