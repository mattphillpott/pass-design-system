<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Provider exam admin — prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="pass.css">
<style>
  body{margin:0;background:var(--bg-soft);font-family:var(--font);color:var(--ink);-webkit-font-smoothing:antialiased;}
  #app{min-height:100vh;}
  .toolbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:16px;
    padding:10px 20px;background:rgba(255,255,255,.86);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--border);font-family:var(--font);}
  .toolbar .brand{font-weight:800;font-size:14px;color:var(--ink);display:flex;align-items:center;gap:9px;}
  .toolbar .brand .dot{width:22px;height:22px;border-radius:7px;background:var(--green);color:#fff;display:flex;align-items:center;justify-content:center;}
  .toolbar .crumb{font-size:13px;color:var(--gray);font-weight:500;}
  .toolbar .spacer{flex:1;}
  .seg{display:inline-flex;background:var(--bg-soft);border:1px solid var(--border);border-radius:9px;padding:3px;gap:2px;}
  .seg button{font:600 13px var(--font);border:0;background:transparent;color:var(--gray);padding:6px 14px;border-radius:7px;cursor:pointer;display:flex;align-items:center;gap:7px;}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow-card);}
  .seg button.on svg{color:var(--green);}
  .tlink{font:600 13px var(--font);color:var(--gray);background:none;border:0;cursor:pointer;display:flex;align-items:center;gap:7px;}
  .tlink:hover{color:var(--ink);}
  .stage{max-width:1320px;margin:0 auto;}
  .tlink.on-explain{color:var(--green);}
  body.xp-open .stage{padding-right:404px;}

  /* explanation layer */
  .xp-pins{position:fixed;inset:0;z-index:40;pointer-events:none;}
  .xp-pin{position:fixed;pointer-events:auto;transform:translate(-50%,-50%);
    width:26px;height:26px;border-radius:50%;border:2px solid #fff;cursor:pointer;
    background:var(--green);color:#fff;font:800 13px var(--font);
    box-shadow:0 4px 12px -2px rgba(11,160,11,.5),0 0 0 1px rgba(11,160,11,.25);
    display:flex;align-items:center;justify-content:center;}
  .xp-pin:hover{background:var(--green-dark);transform:translate(-50%,-50%) scale(1.12);}
  .xp-pin.is-active{background:var(--ink2);box-shadow:0 0 0 4px rgba(15,188,15,.28),0 4px 12px -2px rgba(29,41,61,.5);}

  .xp-drawer{position:fixed;top:0;right:0;bottom:0;width:388px;z-index:50;
    background:#fff;border-left:1px solid var(--border);box-shadow:-16px 0 40px -24px rgba(29,41,61,.28);
    display:flex;flex-direction:column;font-family:var(--font);}
  .xp-head{display:flex;align-items:center;justify-content:space-between;
    padding:18px 18px 14px;border-bottom:1px solid var(--border-soft);}
  .xp-eyebrow{display:flex;align-items:center;gap:8px;font:800 13px var(--font);
    letter-spacing:.04em;text-transform:uppercase;color:var(--green-dark);}
  .xp-eyebrow svg{color:var(--green);}
  .xp-x{border:0;background:var(--bg-soft);color:var(--gray);width:34px;height:34px;border-radius:8px;
    display:flex;align-items:center;justify-content:center;cursor:pointer;}
  .xp-x:hover{background:var(--border-soft);color:var(--ink);}
  .xp-scroll{flex:1;overflow-y:auto;padding:18px;}
  .xp-intro{font-size:15px;line-height:1.55;color:var(--ink);font-weight:600;
    background:var(--green-tint);border:1px solid var(--green-stroke);border-radius:12px;padding:14px 16px;margin-bottom:22px;}
  .xp-sec{font:800 12px var(--font);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);margin:0 2px 12px;}
  .xp-card{display:flex;gap:13px;padding:14px;border:1px solid var(--border);border-radius:12px;
    background:#fff;margin-bottom:12px;transition:box-shadow .2s,border-color .2s,background .2s;}
  .xp-card.is-active{border-color:var(--green);box-shadow:0 0 0 3px rgba(15,188,15,.16);}
  .xp-card.is-bg{background:var(--bg-soft);}
  .xp-cn{flex:0 0 auto;width:26px;height:26px;border-radius:50%;background:var(--green);color:#fff;
    font:800 13px var(--font);display:flex;align-items:center;justify-content:center;}
  .xp-card.is-bg .xp-cn{background:var(--mute);}
  .xp-tt{font-size:14.5px;font-weight:700;color:var(--ink);line-height:1.35;margin-bottom:5px;}
  .xp-wy{font-size:13.5px;line-height:1.55;color:var(--gray);}
  .xp-flag{display:flex;align-items:center;gap:6px;margin-top:9px;font:600 12px var(--font);color:var(--amber);}
  .xp-empty{font-size:13.5px;color:var(--gray);background:var(--bg-soft);border:1px dashed var(--border);border-radius:10px;padding:13px;margin-bottom:6px;}
  .xp-more{display:flex;align-items:center;gap:8px;width:100%;justify-content:center;margin:6px 0 18px;
    border:1px solid var(--border);background:#fff;color:var(--ink);font:600 13px var(--font);
    padding:10px;border-radius:9px;cursor:pointer;}
  .xp-more:hover{background:var(--bg-soft);}
  .xp-more svg{color:var(--green);}
  .xp-open{border-top:1px solid var(--border-soft);padding-top:18px;margin-top:6px;}
  .xp-open-h{display:flex;align-items:center;gap:8px;font:800 13px var(--font);color:var(--ink);margin-bottom:10px;}
  .xp-open-h svg{color:var(--amber-ico);}
  .xp-open-row{font-size:13px;line-height:1.5;color:var(--gray);margin-bottom:8px;}
  .xp-open-row b{color:var(--ink);}
  .xp-foot{margin-top:18px;padding-top:14px;border-top:1px solid var(--border-soft);
    font-size:12px;line-height:1.5;color:var(--mute);}
  .xp-mini{display:inline-flex;align-items:center;justify-content:center;width:15px;height:15px;
    border-radius:50%;background:var(--green);color:#fff;font-weight:800;font-size:10px;vertical-align:middle;}
</style>
</head>
<body>
<template id="__bundler_thumbnail" data-bg-color="#0FBC0F">
  <svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
    <rect width="1200" height="800" fill="#0FBC0F"/>
    <g transform="translate(360,232)" fill="none" stroke="#fff" stroke-width="24" stroke-linecap="round" stroke-linejoin="round">
      <rect x="0" y="0" width="480" height="336" rx="36" fill="rgba(255,255,255,0.14)" stroke="none"/>
      <rect x="56" y="64" width="220" height="26" rx="13" fill="#fff" stroke="none"/>
      <rect x="56" y="128" width="368" height="18" rx="9" fill="rgba(255,255,255,0.7)" stroke="none"/>
      <rect x="56" y="176" width="300" height="18" rx="9" fill="rgba(255,255,255,0.7)" stroke="none"/>
      <path d="M300 256 l40 40 l84 -96"/>
    </g>
  </svg>
</template>
<div id="app"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="pass-icons.js"></script>
<script type="text/babel" src="pass-components.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="proto-part1.jsx"></script>
<script type="text/babel" src="proto-part2.jsx"></script>
<script type="text/babel" src="proto-explain.jsx"></script>
<script type="text/babel">
const { useState, useEffect } = React;
const { Onboarding, Dashboard } = window.ProtoParts1;
const { Assign, ProviderDetail, StudentDetail, SelfDetail } = window.ProtoParts2;
const { ExplainLayer } = window.ProtoExplain;

const TWEAK_DEFAULTS = {
  onboarding: 'modal',
  assignFormat: 'wizard',
  studentView: 'summary',
  setupStyle: 'amber',
  results: 'pending',
};

const LSK = 'pass_provider_proto_v1';
const loadS = () => { try { return JSON.parse(localStorage.getItem(LSK)) || {}; } catch (e) { return {}; } };

function DetailScreen({ viewAs, released, view, studentName }) {
  return (
    <Screen w="100%">
      <Crumbs items={[{ icon: 'Home', label: 'Home' }, { icon: 'GraduationCap', label: 'My Exams' }, { icon: 'Home', label: '#12345' }, { icon: 'CheckCircle', label: viewAs === 'student' ? 'Your exam' : 'View Exam', active: true }]} />
      <PageTitle>{viewAs === 'student' ? 'Your Exam' : 'View Exam'}</PageTitle>
      <div className="grid">
        {viewAs === 'student'
          ? <Stepper title="Maths Level 1" nextLabel={null} steps={[
              { state: 'done', num: 1, label: 'Exam details' },
              { state: 'current', num: 2, label: 'Your exam date' },
              { state: released ? 'done' : 'todo', num: 3, label: 'Results' },
            ]} />
          : <Stepper steps={[
              { state: 'done', num: 1, label: 'View Exam Details' },
              { state: 'done', num: 2, label: 'View Learner Information' },
              { state: 'done', num: 3, label: 'View Instruction Form' },
              { state: 'current', num: 4, label: 'Choose Exam Date' },
              { state: 'todo', num: 5, label: 'View Results' },
            ]} />}
        <div className="stack">
          {viewAs === 'student'
            ? <>
                <div className="dep-bar"><Ico name="ExclamationCircle" size={18} /><div>Reference only — <b>students no longer log in</b>. Kept to show the old student-facing view.</div><span className="tag">Deprecated</span></div>
                <BackLink>Back to My Exams</BackLink><StudentDetail view={view} released={released} />
              </>
            : viewAs === 'self'
              ? <SelfDetail released={released} />
              : <ProviderDetail studentName={studentName} released={released} />}
        </div>
      </div>
    </Screen>
  );
}

function App() {
  const init = loadS();
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);
  window.__tweaks = t;

  const [screen, setScreen] = useState(init.screen || 'onboarding');
  const [assigned, setAssigned] = useState(!!init.assigned);
  const [studentName, setStudentName] = useState(init.studentName || 'Amelia Hughes');
  const [viewAs, setViewAs] = useState(init.viewAs || 'provider');
  const [userType, setUserType] = useState(init.userType || 'provider');
  const [explain, setExplain] = useState(!!init.explain);

  // Results now simply appear in the provider's dashboard — no 'release to student'. Driven by a tweak for preview.
  const released = t.results === 'ready';

  // 'For myself' learners and the deprecated student view never see provider admin chrome.
  const isSelf = userType === 'self';
  const isStudent = userType === 'student';
  const effViewAs = isSelf ? 'self' : isStudent ? 'student' : viewAs;

  useEffect(() => {
    document.body.classList.toggle('xp-open', explain);
    return () => document.body.classList.remove('xp-open');
  }, [explain]);

  useEffect(() => {
    localStorage.setItem(LSK, JSON.stringify({ screen, assigned, viewAs, userType, explain, studentName }));
  }, [screen, assigned, viewAs, userType, explain, studentName]);

  const restart = () => { setScreen('onboarding'); setAssigned(false); setViewAs('provider'); setStudentName('Amelia Hughes'); };

  // Switch which prototype you're previewing. Only 'provider' has the assignment step / onboarding.
  const pickType = (ut) => {
    setUserType(ut);
    if (ut !== 'provider' && (screen === 'assign' || screen === 'onboarding')) setScreen('list');
  };

  const crumbLabel = { onboarding: 'First-login onboarding', list: 'My Exams', assign: 'Assignment step', detail: effViewAs === 'self' ? 'Your exam (full)' : effViewAs === 'student' ? 'Student view (deprecated)' : 'Provider detail' }[screen];

  let body;
  if (screen === 'onboarding') {
    if (t.onboarding === 'banner') {
      body = <Dashboard showBanner assigned={assigned} userType={userType}
        onBannerPick={(w) => { pickType(w === 'me' ? 'self' : 'provider'); setScreen('list'); }}
        onSetup={() => setScreen('assign')} onView={() => { setViewAs('provider'); setScreen('detail'); }} />;
    } else {
      body = <Onboarding format={t.onboarding} onPick={(w) => { pickType(w === 'me' ? 'self' : 'provider'); setScreen('list'); }} />;
    }
  } else if (screen === 'list') {
    body = <Dashboard assigned={assigned} userType={userType} released={released}
      onSetup={() => setScreen('assign')}
      onView={() => { setViewAs('provider'); setScreen('detail'); }} />;
  } else if (screen === 'assign') {
    body = <Assign format={t.assignFormat}
      onBack={() => setScreen('list')}
      onFinish={({ first, last }) => { const nm = [first, last].map(s => (s || '').trim()).filter(Boolean).join(' '); setAssigned(true); setStudentName(nm || 'Amelia Hughes'); setViewAs('provider'); setScreen('detail'); }} />;
  } else {
    body = <DetailScreen viewAs={effViewAs} released={released} view={t.studentView} studentName={studentName} />;
  }

  return (
    <>
      <div className="toolbar">
        <div className="brand"><span className="dot"><Ico name="Check" size={14} /></span>Pass</div>
        <span className="crumb">Prototype · {crumbLabel}</span>
        <div className="spacer" />
        {screen !== 'onboarding' && (
          <div className="seg" title="Switch which prototype you're previewing">
            <button className={!isSelf && !isStudent ? 'on' : ''} onClick={() => pickType('provider')}><Ico name="BellActiveAlt" size={15} />Provider</button>
            <button className={isSelf ? 'on' : ''} onClick={() => pickType('self')}><Ico name="GraduationCap" size={15} />For myself</button>
            <button className={isStudent ? 'on' : ''} onClick={() => pickType('student')} title="Deprecated — students no longer log in; kept for reference"><Ico name="Eye" size={15} />Student<span style={{ marginLeft: 6, fontSize: 9, fontWeight: 800, letterSpacing: '.04em', textTransform: 'uppercase', background: 'var(--amber-stroke)', color: 'var(--amber-deep)', padding: '1px 5px', borderRadius: 6 }}>old</span></button>
          </div>
        )}
        {screen !== 'onboarding' && <button className="tlink" onClick={() => setScreen('list')}><Ico name="GraduationCap" size={15} />My Exams</button>}
        <button className={'tlink' + (explain ? ' on-explain' : '')} onClick={() => setExplain(v => !v)}><Ico name={explain ? 'CheckCircle' : 'InfoCircle'} size={15} />Explain</button>
        <button className="tlink" onClick={restart}><Ico name="ArrowLeft" size={15} />Restart</button>
      </div>
      <div className="stage">{body}</div>
      <ExplainLayer on={explain} screen={screen} viewAs={effViewAs} onClose={() => setExplain(false)} />

      <TweaksPanel>
        <TweakSection label="Onboarding (A)" />
        <TweakRadio label="Prompt format" value={t.onboarding} options={['modal', 'fullscreen', 'banner']} onChange={(v) => setTweak('onboarding', v)} />
        <TweakSection label="Assignment step (D)" />
        <TweakRadio label="Layout" value={t.assignFormat} options={['wizard', 'single']} onChange={(v) => setTweak('assignFormat', v)} />
        <TweakSection label="Exam list (C)" />
        <TweakRadio label="Needs-setup card" value={t.setupStyle} options={['amber', 'subtle']} onChange={(v) => setTweak('setupStyle', v)} />
        <TweakSection label="Results (E)" />
        <TweakRadio label="Result state" value={t.results} options={['pending', 'ready']} onChange={(v) => setTweak('results', v)} />
        <TweakSection label="Student view (F · deprecated)" />
        <TweakRadio label="Treatment" value={t.studentView} options={['summary', 'plain']} onChange={(v) => setTweak('studentView', v)} />
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('app')).render(<App />);
</script>
</body>
</html>
