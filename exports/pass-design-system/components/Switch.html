<!-- Switch — accessible <button role="switch"> or <input type="checkbox" class="sr-only" />.
     The peer pattern below uses a hidden checkbox so it just works without JS. -->

<!-- ─── Standard ─── -->
<label class="inline-flex items-center gap-3 cursor-pointer select-none">
  <input type="checkbox" class="peer sr-only" />
  <span class="relative inline-flex w-10 h-6 items-center rounded-full bg-gray-300 transition-colors duration-200
               peer-checked:bg-primary-600
               peer-focus-visible:ring-[3px] peer-focus-visible:ring-primary-600/25
               peer-disabled:opacity-50 peer-disabled:cursor-not-allowed">
    <span class="inline-block w-5 h-5 bg-white rounded-full shadow translate-x-0.5 transition-transform duration-200
                 peer-checked:translate-x-[18px]"></span>
  </span>
  <span class="text-sm text-fg-1">Email notifications</span>
</label>

<!-- NOTE — the inner thumb cannot read peer-checked from a sibling span; render the
     thumb inside the same label and rely on :has() for production. Vue template: -->

<!-- ─── Sizes (sm / md / lg) ─── -->
<!-- sm -->
<span class="relative inline-block w-8 h-5 rounded-full bg-primary-600">
  <span class="absolute left-0.5 top-0.5 w-4 h-4 bg-white rounded-full shadow translate-x-[12px] transition-transform duration-200"></span>
</span>
<!-- md -->
<span class="relative inline-block w-10 h-6 rounded-full bg-primary-600">
  <span class="absolute left-0.5 top-0.5 w-5 h-5 bg-white rounded-full shadow translate-x-[16px] transition-transform duration-200"></span>
</span>
<!-- lg -->
<span class="relative inline-block w-12 h-7 rounded-full bg-primary-600">
  <span class="absolute left-0.5 top-0.5 w-6 h-6 bg-white rounded-full shadow translate-x-[20px] transition-transform duration-200"></span>
</span>

<!-- ─── Off / hover / disabled ─── -->
<span class="relative inline-block w-10 h-6 rounded-full bg-gray-300"><span class="absolute left-0.5 top-0.5 w-5 h-5 bg-white rounded-full shadow"></span></span>
<span class="relative inline-block w-10 h-6 rounded-full bg-gray-400"><span class="absolute left-0.5 top-0.5 w-5 h-5 bg-white rounded-full shadow"></span></span>
<span class="relative inline-block w-10 h-6 rounded-full bg-gray-200 opacity-50 cursor-not-allowed"><span class="absolute left-0.5 top-0.5 w-5 h-5 bg-white rounded-full shadow"></span></span>
