<!-- Drawer / Side Sheet — slide from right/left/top/bottom.
     Requires JS to toggle [data-open]. Use PrimeVue Drawer (unstyled) or hand-roll.
     Class strings below — apply to elements rendered by the headless lib. -->

<!-- ─── Right drawer (default) ─── -->
<div role="presentation" class="fixed inset-0 z-[1300] bg-gray-900/50 backdrop-blur-[4px] data-[open=false]:opacity-0 data-[open=false]:pointer-events-none transition-opacity duration-300" data-open="true"></div>

<aside role="dialog" aria-modal="true" data-open="true"
  class="fixed top-0 right-0 z-[1400] h-dvh w-full sm:w-[420px] bg-bg-surface shadow-xl border-l border-border-default
         flex flex-col
         translate-x-0 data-[open=false]:translate-x-full
         transition-transform duration-300 ease-[cubic-bezier(.4,0,.2,1)]">

  <header class="flex items-center justify-between px-5 h-14 border-b border-border-default">
    <h2 class="text-base font-semibold text-fg-1">Filters</h2>
    <button type="button" aria-label="Close" class="inline-flex w-8 h-8 items-center justify-center rounded-md text-fg-4 hover:bg-bg-raised hover:text-fg-1 focus-visible:ring-[3px] focus-visible:ring-primary-600/25">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M6 6l12 12M6 18L18 6"/></svg>
    </button>
  </header>

  <div class="flex-1 overflow-y-auto px-5 py-4 space-y-5">
    <!-- drawer content -->
  </div>

  <footer class="px-5 py-3 border-t border-border-default flex items-center justify-end gap-2 bg-bg-sunken">
    <button class="h-10 px-4 rounded-lg text-sm font-medium text-fg-2 hover:bg-bg-raised">Reset</button>
    <button class="h-10 px-4 rounded-lg text-sm font-medium bg-primary-600 text-white hover:bg-primary-700">Apply filters</button>
  </footer>
</aside>

<!-- ─── Left drawer (mobile nav) ─── -->
<aside class="fixed top-0 left-0 z-[1400] h-dvh w-72 bg-bg-surface shadow-xl border-r border-border-default
              -translate-x-full data-[open=true]:translate-x-0
              transition-transform duration-300 ease-[cubic-bezier(.4,0,.2,1)]">
  <!-- ...same structure... -->
</aside>

<!-- ─── Bottom sheet ─── -->
<aside class="fixed inset-x-0 bottom-0 z-[1400] max-h-[80dvh] bg-bg-surface shadow-xl border-t border-border-default rounded-t-2xl
              translate-y-full data-[open=true]:translate-y-0
              transition-transform duration-300 ease-[cubic-bezier(.4,0,.2,1)]">
  <div class="h-1.5 w-12 rounded-full bg-gray-300 mx-auto my-3"></div>
  <!-- ...content... -->
</aside>
