<!-- Menu — dropdown / context / select-like.
     Pure-CSS popover OK for hover-only menus; for click + keyboard, use PrimeVue Menu (unstyled).

     Class strings for the panel + items below. -->

<!-- ─── Trigger + panel (use details for no-JS toggle, or PrimeVue for ARIA) ─── -->
<details class="relative inline-block group">
  <summary class="list-none inline-flex items-center gap-1.5 h-10 px-3 rounded-lg text-sm font-medium text-fg-1 bg-bg-surface border border-border-default hover:bg-bg-raised cursor-pointer
                  focus-visible:outline-none focus-visible:ring-[3px] focus-visible:ring-primary-600/25">
    Actions
    <svg class="w-4 h-4 text-fg-4 transition-transform group-open:rotate-180" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
  </summary>

  <div role="menu" class="absolute right-0 mt-1 w-56 z-[1500] rounded-lg bg-bg-surface border border-border-default shadow-lg overflow-hidden
                          animate-[menu-in_150ms_cubic-bezier(0,0,0.2,1)]">
    <div class="py-1">
      <button role="menuitem" class="w-full text-left flex items-center gap-3 px-3 py-2 text-sm text-fg-1 hover:bg-bg-raised focus-visible:bg-bg-raised outline-none">
        <svg class="w-4 h-4 text-fg-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 4v16m8-8H4"/></svg>
        Add learner
        <span class="ml-auto text-xs text-fg-4">⌘N</span>
      </button>
      <button role="menuitem" class="w-full text-left flex items-center gap-3 px-3 py-2 text-sm text-fg-1 hover:bg-bg-raised">
        <svg class="w-4 h-4 text-fg-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M4 4h16v16H4z"/></svg>
        Import CSV
      </button>
      <button role="menuitem" class="w-full text-left flex items-center gap-3 px-3 py-2 text-sm text-fg-1 hover:bg-bg-raised">
        <svg class="w-4 h-4 text-fg-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M4 21h16"/></svg>
        Export report
      </button>
    </div>
    <div class="border-t border-border-default py-1">
      <button role="menuitem" class="w-full text-left flex items-center gap-3 px-3 py-2 text-sm text-danger-700 hover:bg-danger-50">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M3 6h18M5 6v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V6M9 6V4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/></svg>
        Delete cohort
      </button>
    </div>
  </div>
</details>

<!-- ─── Menu items — checked / radio / nested / disabled ─── -->
<button role="menuitemcheckbox" aria-checked="true" class="w-full text-left flex items-center gap-3 px-3 py-2 text-sm text-fg-1 hover:bg-bg-raised">
  <svg class="w-4 h-4 text-primary-600" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M5 12l5 5L20 7"/></svg>
  Show completed
</button>

<button role="menuitemradio" aria-checked="true" class="w-full text-left flex items-center gap-3 px-3 py-2 text-sm text-fg-1 hover:bg-bg-raised">
  <span class="inline-flex w-4 h-4 items-center justify-center rounded-full border border-primary-600">
    <span class="w-2 h-2 rounded-full bg-primary-600"></span>
  </span>
  Sort by name
</button>

<button role="menuitem" aria-disabled="true" class="w-full text-left flex items-center gap-3 px-3 py-2 text-sm text-fg-5 cursor-not-allowed">
  <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/></svg>
  Archive cohort (locked)
</button>

<!-- ─── Section heading ─── -->
<div role="presentation" class="px-3 pt-3 pb-1 text-[11px] font-semibold uppercase tracking-wider text-fg-4">Workspace</div>

<!--
  @keyframes menu-in {
    from { opacity: 0; transform: translateY(-4px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0)    scale(1); }
  }
-->
