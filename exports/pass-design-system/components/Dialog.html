<!-- Dialog / Modal — Pass uses native <dialog> when possible, otherwise
     PrimeVue Dialog (unstyled) with these class strings.
     SHOW: dialog.showModal()      CLOSE: dialog.close()

     Backdrop: rgba(17,24,39,0.5) + backdrop-blur(4px). -->

<dialog open
  class="rounded-xl bg-bg-surface text-fg-1 shadow-lg border border-border-default p-0 max-w-[480px] w-[90vw]
         backdrop:bg-gray-900/50 backdrop:backdrop-blur-[4px]
         open:animate-[dialog-in_300ms_cubic-bezier(0,0,0.2,1)]">
  <!-- Header -->
  <div class="flex items-start gap-3 px-6 pt-6 pb-4">
    <div class="flex-1">
      <h2 class="text-lg font-semibold text-fg-1">Delete cohort?</h2>
      <p class="mt-1 text-sm text-fg-3">This will remove all 24 learners. This action cannot be undone.</p>
    </div>
    <button type="button" aria-label="Close" class="inline-flex w-8 h-8 items-center justify-center rounded-md text-fg-4 hover:bg-bg-raised hover:text-fg-1 focus-visible:ring-[3px] focus-visible:ring-primary-600/25">
      <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M6 6l12 12M6 18L18 6"/></svg>
    </button>
  </div>

  <!-- Body (optional separator) -->
  <div class="px-6 pb-2 text-sm text-fg-2">
    <label class="inline-flex items-center gap-2">
      <input type="checkbox" class="w-4 h-4 accent-primary-600 rounded-sm"/>
      <span>Also delete archived assessments</span>
    </label>
  </div>

  <!-- Footer -->
  <div class="flex items-center justify-end gap-2 px-6 py-4 bg-bg-sunken border-t border-border-default rounded-b-xl">
    <button type="button" class="h-10 px-4 rounded-lg text-sm font-medium text-fg-2 hover:bg-bg-raised">Cancel</button>
    <button type="button" class="h-10 px-4 rounded-lg text-sm font-medium bg-danger-600 text-white hover:bg-danger-700">Delete cohort</button>
  </div>
</dialog>

<!-- Keyframes — put in tokens or component layer -->
<!--
  @keyframes dialog-in {
    from { opacity: 0; transform: translateY(8px) scale(0.98); }
    to   { opacity: 1; transform: translateY(0)   scale(1); }
  }
-->

<!-- ─── Sizes ─── -->
<!-- sm  max-w-[400px]    md  max-w-[480px]    lg  max-w-[640px]    xl  max-w-[800px]   full  max-w-[calc(100vw-2rem)] -->

<!-- ─── Confirm (sentinel use of red) ─── -->
<dialog class="rounded-xl bg-bg-surface shadow-lg p-6 max-w-[400px] w-[90vw] backdrop:bg-gray-900/50 backdrop:backdrop-blur-[4px]">
  <div class="flex items-start gap-3">
    <div class="flex-none w-10 h-10 rounded-full bg-danger-50 inline-flex items-center justify-center">
      <svg class="w-5 h-5 text-danger-600" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M12 9v4m0 4h.01M5 19h14a2 2 0 0 0 1.84-2.75L13.74 4a2 2 0 0 0-3.48 0L3.16 16.25A2 2 0 0 0 5 19z"/></svg>
    </div>
    <div class="flex-1">
      <h2 class="text-base font-semibold">Reset learner progress?</h2>
      <p class="mt-1 text-sm text-fg-3">All topic-test scores will be cleared.</p>
      <div class="mt-4 flex justify-end gap-2">
        <button class="h-9 px-3 rounded-md text-sm font-medium text-fg-2 hover:bg-bg-raised">Cancel</button>
        <button class="h-9 px-3 rounded-md text-sm font-medium bg-danger-600 text-white hover:bg-danger-700">Reset</button>
      </div>
    </div>
  </div>
</dialog>
