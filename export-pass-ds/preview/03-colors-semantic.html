<!DOCTYPE html>
<!-- TXT@dsCard group="Colors" name="Semantic colors" subtitle="Success / Warning / Danger / Info" viewport="720x120" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css?v=1777049570539"><style>
body{margin:0;padding:20px;background:#fff;font-family:var(--font-sans)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.card{border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:6px}
.t{font-size:13px;font-weight:600}
.h{font-size:11px;font-family:ui-monospace,monospace;opacity:.75}
</style></head><body>
<div class="grid">
<div class="card" style="background:#ECFDF5;color:#047857;border:1px solid #A7F3D0"><div class="t">Success</div><div class="h">#0E9F6E</div><div style="font-size:11px">Pass · Correct · Submitted</div></div>
<div class="card" style="background:#FFF7ED;color:#9A3412;border:1px solid #FED7AA"><div class="t">Warning</div><div class="h">#D97706</div><div style="font-size:11px">Due soon · Review needed</div></div>
<div class="card" style="background:#FDF2F2;color:#9B1C1C;border:1px solid #FBD5D5"><div class="t">Danger</div><div class="h">#C70036</div><div style="font-size:11px">Fail · Incorrect · Overdue</div></div>
<div class="card" style="background:#EEF6FF;color:#1447E6;border:1px solid #BEDBFF"><div class="t">Info</div><div class="h">#1C64F2</div><div style="font-size:11px">Hint · Tip · Announcement</div></div>
</div>
</body></html>
