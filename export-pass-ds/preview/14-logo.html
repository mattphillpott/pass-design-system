<!DOCTYPE html>
<!-- TXT@dsCard group="Brand" name="Logo" subtitle="Placeholder wordmark + mark" viewport="720x150" --><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css?v=4"><style>
body{margin:0;padding:24px;background:#fff;font-family:var(--font-sans)}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;align-items:stretch}
.tile{border:1px solid #E5E7EB;border-radius:12px;padding:24px;display:flex;align-items:center;justify-content:center;min-height:140px}
.tile.dark{background:#121F33;border-color:#121F33}
.tile.brand{background:#0FBC0F;border-color:#0FBC0F}
.lbl{font-size:11px;color:var(--fg-4);margin-top:6px;font-weight:500;text-align:center}
img{max-width:100%;max-height:80px;display:block}
h4{margin:0 0 10px;font-size:13px;font-weight:600;color:var(--fg-1)}
.group{margin-bottom:18px}
</style></head><body>

<div class="group">
<h4>Wordmark</h4>
<div class="row">
<div><div class="tile"><img src="../assets/logos/pass-wordmark.svg" alt="Pass wordmark"></div><div class="lbl">On light · pass-wordmark.svg</div></div>
<div><div class="tile dark"><img src="../assets/logos/pass-wordmark-on-dark.svg" alt="Pass wordmark on dark"></div><div class="lbl">On dark · pass-wordmark-on-dark.svg</div></div>
<div><div class="tile brand"><img src="../assets/logos/pass-wordmark-on-dark.svg" alt="Pass wordmark on brand"></div><div class="lbl">On brand · same as on-dark</div></div>
</div>
</div>

<div class="group">
<h4>Mark only</h4>
<div class="row">
<div><div class="tile"><img src="../assets/logos/pass-mark.svg" alt="Pass mark" style="max-height:64px"></div><div class="lbl">pass-mark.svg</div></div>
<div><div class="tile dark"><img src="../assets/logos/pass-mark.svg" alt="Pass mark on dark" style="max-height:64px"></div><div class="lbl">on dark surface</div></div>
<div><div class="tile" style="background:#F0FEEF;border-color:#B8FBB7"><img src="../assets/logos/pass-mark.svg" alt="Pass mark on tint" style="max-height:64px"></div><div class="lbl">on brand-50 tint</div></div>
</div>
</div>

</body></html>
