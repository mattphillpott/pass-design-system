<!DOCTYPE html>
<!-- TXT@dsCard group="Brand" name="Icon set" subtitle="Flowbite-aligned 2px outline set" viewport="720x240" --><html><head><meta charset="utf-8"><style>
body{margin:0;padding:20px;background:#fff;font-family:'Inter',system-ui,sans-serif}
.grid{display:grid;grid-template-columns:repeat(8,1fr);gap:14px}
.cell{display:flex;flex-direction:column;align-items:center;gap:4px;color:#4A5565}
.cell svg{width:24px;height:24px}
.n{font-size:10px;color:#6A7282;font-family:ui-monospace,monospace}
</style></head><body>
<div class="grid" id="g"></div>
<script>
const names=['home','book-open','graduation-cap','clipboard-list','calculator','chart-bar','users','user','bell','search','check-circle','x','arrow-right','chevron-right','menu','settings','clock','award','play','trending-up','file-text','message-circle','lightbulb','sparkles'];
const g=document.getElementById('g');
Promise.all(names.map(n=>fetch('../assets/icons/'+n+'.svg').then(r=>r.text()).then(svg=>{
  const d=document.createElement('div');d.className='cell';d.innerHTML=svg+'<div class="n">'+n+'</div>';g.appendChild(d);
})));
</script></body></html>
